<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BattleShip</title>
    <script type="module" src="/src/index.js"></script>
  </head>
  <body>
    <main class="startScreen hidden">
      <div class="start-panel">
        <header class="start-header">
          <h1>Battleship</h1>
          <p>The Battle for Azeroth</p>
        </header>

        <div class="start-decoration">⚔</div>

        <div class="start-form">
          <label for="playerName">Enter your name general:</label>

          <input type="text" id="playerName" />

          <button class="start-app-btn">Start</button>
        </div>
      </div>
    </main>
    <main class="characterSelection hidden">character selection</main>
    <main class="shipPlacement hidden">ship shipPlacement</main>
    <main class="game hidden">
      <header class="game-header">
        <h1>BATTLESHIP</h1>
        <p>The Battle for Azeroth</p>
      </header>

      <section id="turn-result" class="battle-report">
        <h2>Battle Report</h2>

        <div class="battle-content">
          <div class="character-portrait">
            <img src="" alt="Character portrait" />
          </div>

          <div class="battle-message">
            <p class="character"></p>
            <p class="message">Your turn!</p>
          </div>
        </div>
      </section>

      <section class="boards-container">
        <div class="board-wrapper">
          <h2>⚓ Your Fleet</h2>
          <div id="my-board"></div>
        </div>

        <div class="board-wrapper">
          <h2>☠ Enemy Fleet</h2>
          <div id="enemy-board"></div>
        </div>
      </section>

      <div id="game-over-modal" class="game-over-modal hidden">
        <div class="game-over-panel">
          <div class="game-over-header">
            <span class="game-over-decoration">⚔</span>
            <h2>Battle Ended</h2>
            <span class="game-over-decoration">⚔</span>
          </div>

          <div class="game-over-content">
            <div class="game-over-dialogue">
              <div class="game-over-character">
                <img src="" alt="Character portrait" />
              </div>

              <div class="game-over-quote">
                <p>"The battle is over. You fought well, warrior."</p>
              </div>
            </div>

            <p class="game-over-winner">
              <span>Victory belongs to</span>
              <strong></strong>
            </p>
          </div>

          <button class="game-over-button">Play Again</button>
        </div>
      </div>
    </main>
  </body>
</html>
